<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <hta:application
            applicationname="Break Reminder"
            id="breakReminder"
            singleinstance="yes"
            border="thick"
            borderstyle="normal"
            maximizeButton="yes"
            minimizeButton="yes"
    />
    <title>Break Reminder</title>
</head>
<body>
    <h1>Break Reminder</h1>
    <input type="button" value="Work" id="workButton"> <!--Start to work-->
    <input type="button" value="Break" id="breakButton"> <!--Start your break-->

</body>
</html>
