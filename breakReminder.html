<!DOCTYPE html>
<html lang='en'>

<head>
<meta charset='UTF-8'>
<meta http-equiv='x-ua-compatible' content='IE=edge'>
<hta:application
        applicationname='Break Reminder'
        id='breakReminder'
        singleinstance='yes'
        border='thick'
        borderstyle='normal'
        maximizeButton='yes'
        minimizeButton='yes'
/>
<title>Break Reminder</title>
</head>

<body>
<h1>Break Reminder</h1>

<p id='myStatus'>Free Time</p> <!--Currently 'Working' / 'Break'-->

<div id='myTimer'></div>
<div id='breakTimer'></div>

<button id='startWorkingButton'>Start Work</button>
<button id='startBreakButton'>Start Break</button>

<script>
    var startWorkingButton = document.getElementById('startWorkingButton');
    var startBreakButton = document.getElementById('startBreakButton');
    var myStatus = document.getElementById('myStatus');
    var myTimer = document.getElementById('myTimer');
    var breakTimer = document.getElementById('breakTimer');
    var state = 'idle';
    var workStart = null;
    var workTotal = 0;
    var breakStart = null;
    var breakTotal = 0;

    startWorkingButton.addEventListener('click', function() {
        if (state !== 'working') {
            myStatus.textContent = 'Working';
            workStart = Date.now();
            if (state === 'onBreak') {
                breakTotal += Date.now() - breakStart;
                breakStart = null;
            }
            state = 'working';
        }
    });

    startBreakButton.addEventListener('click', function() {
        if (state === 'working') {
            myStatus.textContent = 'On break';
            workTotal += Date.now() - workStart;
            workStart = null;
            breakStart = Date.now();
            state = 'onBreak';
        }
    });

    function updateTimer() {
        if (workStart !== null) {
            var elapsedTime = Date.now() - workStart;
            myTimer.textContent = formatTime(elapsedTime + workTotal);
        } else {
            myTimer.textContent = formatTime(workTotal);
        }
        if (breakStart !== null) {
            var elapsedBreakTime = Date.now() - breakStart;
            breakTimer.textContent = formatTime(elapsedBreakTime + breakTotal);
        } else {
            breakTimer.textContent = formatTime(breakTotal);
        }
    }

    function formatTime(timeSpan) {
        var sec =  Math.floor((timeSpan % (1000 * 60)) / 1000);
        var min = Math.floor((timeSpan % (1000 * 60 * 60)) / (1000 * 60));
        var hours = Math.floor(timeSpan / (1000 * 60 * 60));
        return addZero(hours) + ':' + addZero(min) + ':' + addZero(sec);
    }

    function addZero(number) {
        if (number < 10) {
            return '0' + number;
        } else {
            return number;
        }
    }

    setInterval(updateTimer, 1000);


</script>
</body>
</html>
