<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <!-- Use the newest available IE engine mode in the HTA -->
    <meta http-equiv='x-ua-compatible' content='IE=edge'>
    <!-- HTA window settings (ignored by normal browsers) -->
    <hta:application
            applicationname='Break Reminder'
            id='breakReminder'
            singleinstance='yes'
            border='thick'
            borderstyle='normal'
            maximizeButton='yes'
            minimizeButton='yes'
    />
    <title>Break Reminder</title>
</head>

<body>
<h1>Break Reminder</h1>

<!-- Current status: 'Free Time' / 'Working' / 'On break' -->
<p id='myStatus'>Free Time</p>

<!-- Total work time -->
<div id='myTimer'></div>

<!-- Break time (break credit + running break) -->
<div id='breakTimer'></div>

<button id='startWorkingButton'>Start Work</button>
<button id='startBreakButton'>Start Break</button>

<div id='timeForBreak' style='display: none;'>
    Time for a Break!
    <button id='closeTimeForBreakButton'>Dismiss</button>
</div>


<script>
    // TODO: Set back to 60 seconds before release. 1000 = time lapse for testing.
    var MINUTE = 1000;

    // DOM elements
    var startWorkingButton = document.getElementById('startWorkingButton');
    var startBreakButton = document.getElementById('startBreakButton');
    var myStatus = document.getElementById('myStatus');
    var myTimer = document.getElementById('myTimer');
    var breakTimer = document.getElementById('breakTimer');
    var timeForBreak = document.getElementById('timeForBreak');
    var closeTimeForBreakButton = document.getElementById('closeTimeForBreakButton');

    // App state
    var state = 'idle';     // 'idle' | 'working' | 'onBreak'
    var workStart = null;   // Start of the current work segment (null = not working)
    var workTotal = 0;      // Sum of finished work segments (ms)
    var breakStart = null;  // Start of the current break (null = not on break)
    var breakTotal = 0;     // Break credit: sum of breaks of at least 5 minutes (ms)
    var nextReminder = 60 * MINUTE;

    // Work Handler: start working or end a break
    startWorkingButton.addEventListener('click', function () {
        if (state !== 'working') {
            myStatus.textContent = 'Working';
            workStart = Date.now();
            // Coming back from a break: check if it counts towards the break credit
            if (state === 'onBreak') {
                var breakDuration = Date.now() - breakStart;
                // Only breaks of at least 5 minutes count
                if (breakDuration >= (5 * MINUTE)) {
                    breakTotal += breakDuration;
                }
                // Break credit full: start a new work cycle
                if (breakTotal >= (10 * MINUTE)) {
                    workTotal = 0;
                    breakTotal = 0;
                }
                breakStart = null;
            }
            state = 'working';
        }
    });

    // Break Handler: pause the work timer and start a break
    startBreakButton.addEventListener('click', function () {
        if (state === 'working') {
            myStatus.textContent = 'On break';
            workTotal += Date.now() - workStart;  // Save the finished work segment
            workStart = null;
            breakStart = Date.now();
            state = 'onBreak';
        }
    });

    // Dismiss Handler: hide the break reminder
    closeTimeForBreakButton.addEventListener('click', function () {
        timeForBreak.style.display = 'none';
    });

    // Updates both timer displays (called every second)
    function updateTimer() {
        // Work time: finished segments + running segment
        var currentWork = workTotal;
        if (workStart !== null) {
            currentWork += Date.now() - workStart;
        }

        // Break time: break credit + running break
        var currentBreak = breakTotal;
        if (breakStart !== null) {
            currentBreak += Date.now() - breakStart;
        }

        // Update displays
        myTimer.textContent = formatTime(currentWork);
        breakTimer.textContent = formatTime(currentBreak);

        if (currentWork >= nextReminder) {
            timeForBreak.style.display = 'block';
            nextReminder += 10 * MINUTE;
        }
    }

    // Converts milliseconds to 'hh:mm:ss'
    function formatTime(timeSpan) {
        var sec = Math.floor((timeSpan % (1000 * 60)) / 1000);
        var min = Math.floor((timeSpan % (1000 * 60 * 60)) / (1000 * 60));
        var hours = Math.floor(timeSpan / (1000 * 60 * 60));
        return addZero(hours) + ':' + addZero(min) + ':' + addZero(sec);
    }

    // Adds a leading zero to numbers below 10 (5 -> '05')
    function addZero(number) {
        if (number < 10) {
            return '0' + number;
        } else {
            return number;
        }
    }

    // Ticker: refresh the displays once per second
    setInterval(updateTimer, 1000);

</script>
</body>
</html>
