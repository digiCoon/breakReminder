        body {
            background-color: #12111A;
            color: #F1F5F9;
            font-size: 16px;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
        }

        button {
            background-color: #1E1B2E;
            color: #F1F5F9;
            border: 2px solid #8574FB;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8574FB;
            background-image: linear-gradient(90deg, #8CFEFE, #8574FB, #FE27FD);
            color: #12111A;
            border-color: #8574FB;
            box-shadow: 0 0 12px #8574FB;
        }

        #card {
            box-sizing: border-box;
            background-color: #1E1B2E;
            border: 1px solid #8574FB;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(133, 116, 251, 0.4);
            padding: 16px;
            margin: 0 auto;
            max-width: 320px;
        }

        #myStatus {
            margin: 0 0 12px 0;
            font-size: 18px;
        }

        #myStatus.idle {
            color: #8574FB;
        }

        #myStatus.working {
            color: #FE27FD;
        }

        #myStatus.onBreak {
            color: #8CFEFE;
        }

        #myTimer,
        #breakTimer {
            margin-bottom: 6px;
            font-size: 28px;
            font-family: 'Courier New', monospace;
        }

        #toggleButton {
            margin-top: 12px;
            font-size: 14px;
        }

        #toggleButton.startWork {
            border-color: #8CFEFE;
        }

        #toggleButton.startBreak {
            border-color: #FE27FD;
        }

        #timeForBreak {
            display: none;
            box-sizing: border-box;
            max-width: 320px;
            margin: 16px auto 0 auto;
            padding: 16px;
            background-color: #1E1B2E;
            border: 2px solid #FE27FD;
            border-radius: 12px;
            color: #FE27FD;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 12px #FE27FD;
        }

        #closeTimeForBreakButton {
            display: block;
            margin: 12px auto 0 auto;
        }
    </style>
</head>

<body>
<h1>digiCoon's break reminder</h1>

<div id='card'>
    <!-- Current status: 'free time' / 'working' / 'on break' -->
    <p id='myStatus' class='idle'>free time</p>

    <!-- Total work time -->
    <div id='myTimer'></div>

    <!-- Break time (break credit + running break) -->
    <div id='breakTimer'></div>

    <!-- Switches between 'start work' and 'start break' -->
    <button id='toggleButton'>start work</button>
</div>

<!-- Break reminder (hidden until a reminder is due) -->
<div id='timeForBreak'>
    time for a break!
    <button id='closeTimeForBreakButton'>dismiss</button>
</div>

<script>
    // Default window size
    var WINDOW_WIDTH = 400;
    var WINDOW_HEIGHT = 420;
    // Start with the default window
    setDefaultWindow();

    // One minute in ms. Set to a small value (e.g. 100) for time-lapse testing.
    var MINUTE = 60 * 1000;

    // DOM elements
    var toggleButton = document.getElementById('toggleButton');
    var myStatus = document.getElementById('myStatus');
    var myTimer = document.getElementById('myTimer');
    var breakTimer = document.getElementById('breakTimer');
    var timeForBreak = document.getElementById('timeForBreak');
    var closeTimeForBreakButton = document.getElementById('closeTimeForBreakButton');

    // App state
    var state = 'idle';             // 'idle' | 'working' | 'onBreak'
    var workStart = null;           // Start of the current work segment (null = not working)
    var workTotal = 0;              // Sum of finished work segments (ms)
    var breakStart = null;          // Start of the current break (null = not on break)
    var breakTotal = 0;             // Break credit: sum of breaks of at least 5 minutes (ms)
    var nextReminder = 60 * MINUTE; // Work time at which the next reminder appears (ms)

    // Event handlers
    toggleButton.addEventListener('click', toggleWorkBreak);
    closeTimeForBreakButton.addEventListener('click', function () {
        timeForBreak.style.display = 'none';
        setDefaultWindow();
    });

    function toggleWorkBreak() {
        if (state !== 'working') {
            startWork();
            toggleButton.textContent = 'start break';
            toggleButton.className = 'startBreak';
        } else {
            startBreak();
            toggleButton.textContent = 'start work';
            toggleButton.className = 'startWork';
        }
    }

    function startWork() {
        myStatus.textContent = 'working';
        workStart = Date.now();
        // Coming back from a break: check if it counts towards the break credit
        if (state === 'onBreak') {
            var breakDuration = Date.now() - breakStart;
            // Only breaks of at least 5 minutes count
            if (breakDuration >= (5 * MINUTE)) {
                breakTotal += breakDuration;
            }
            // Break credit full: start a new work cycle
            if (breakTotal >= (10 * MINUTE)) {
                workTotal = 0;
                breakTotal = 0;
                nextReminder = 60 * MINUTE;
                timeForBreak.style.display = 'none';
                closeTimeForBreakButton.style.visibility = '';
                setDefaultWindow();
            }
            breakStart = null;
        }
        state = 'working';
        myStatus.className = state;
    }

    function startBreak() {
        myStatus.textContent = 'on break';
        workTotal += Date.now() - workStart;  // Save the finished work segment
        workStart = null;
        breakStart = Date.now();
        state = 'onBreak';
        myStatus.className = state;
    }

    // Updates the displays and shows reminders (called every second)
    function updateTimer() {
        // Work time: finished segments + running segment
        var currentWork = workTotal;
        if (workStart !== null) {
            currentWork += Date.now() - workStart;
        }
        // Break time: break credit + running break
        var currentBreak = breakTotal;
        if (breakStart !== null) {
            currentBreak += Date.now() - breakStart;
        }
        // Update displays
        myTimer.textContent = formatTime(currentWork);
        breakTimer.textContent = formatTime(currentBreak);
        // Show reminder, then schedule the next one 10 minutes later
        if (currentWork >= nextReminder) {
            timeForBreak.style.display = 'block';
            centerWindow();
            // From 90 minutes on: no dismiss, forced break
            if (nextReminder >= 90 * MINUTE) {
                closeTimeForBreakButton.style.visibility = 'hidden';
                setFullScreenWindow();
            }
            nextReminder += 10 * MINUTE;
        }
    }

    // Converts milliseconds to 'hh:mm:ss'
    // Uses real milliseconds (not MINUTE) on purpose: the display always shows real time
    function formatTime(timeSpan) {
        var sec = Math.floor((timeSpan % (1000 * 60)) / 1000);
        var min = Math.floor((timeSpan % (1000 * 60 * 60)) / (1000 * 60));
        var hours = Math.floor(timeSpan / (1000 * 60 * 60));
        return addZero(hours) + ':' + addZero(min) + ':' + addZero(sec);
    }

    // Adds a leading zero to numbers below 10 (5 -> '05')
    function addZero(number) {
        if (number < 10) {
            return '0' + number;
        } else {
            return number;
        }
    }

    // Window helpers (HTA only, browsers ignore window size and position)
    function centerWindow() {
        window.moveTo((screen.availWidth - WINDOW_WIDTH) / 2, (screen.availHeight - WINDOW_HEIGHT) / 2);
    }

    function setDefaultWindow() {
        centerWindow();
        window.resizeTo(WINDOW_WIDTH, WINDOW_HEIGHT);
    }

    function setFullScreenWindow() {
        window.moveTo(0, 0);
        window.resizeTo(screen.availWidth, screen.availHeight);
    }

    // Ticker: refresh the displays once per second
    setInterval(updateTimer, 1000);

</script>
</body>
</html>
